<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="240" viewBox="0 0 1440 240" role="img" aria-label="vibe-studio 内容流水线">
  <defs>
    <style>
      .wm  { font: 900 46px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #FAF6F0; letter-spacing: 1px; }
      .tag { font: 600 12px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #CC785C; letter-spacing: 4px; }
      .sub { font: 400 14px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #A8A29E; }
      .st  { font: 600 13px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #D6D3D1; }
      .std { font: 400 11px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #78716C; }
      .icon{ stroke: #CC785C; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .line{ stroke: #57534E; stroke-width: 1.4; fill: none; }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#78716C"/>
    </marker>
  </defs>

  <rect width="1440" height="240" rx="18" fill="#1C1917"/>

  <!-- 左：wordmark -->
  <rect x="56" y="52" width="26" height="2" fill="#CC785C"/>
  <text x="56" y="78" class="tag">VIBE-STUDIO</text>
  <text x="54" y="130" class="wm">vibe-studio</text>
  <text x="56" y="162" class="sub">自媒体内容工厂 — 从项目说明到成片的一条流水线</text>

  <!-- 右：三段流水线 -->
  <g transform="translate(760,60)">
    <!-- Step 1 · deck -->
    <g transform="translate(0,0)">
      <rect width="170" height="112" rx="10" fill="#211D1A" stroke="#2E2A27"/>
      <g class="icon" transform="translate(20,18)">
        <rect x="0" y="0" width="26" height="19" rx="2.5"/>
        <line x1="5" y1="7" x2="17" y2="7"/>
        <line x1="5" y1="12" x2="13" y2="12"/>
      </g>
      <text x="20" y="66" class="st">ppt-deck</text>
      <text x="20" y="86" class="std">python-pptx 代码画 PPT</text>
      <text x="20" y="102" class="std">品牌网格 · 渲染核查闭环</text>
    </g>

    <line x1="170" y1="56" x2="212" y2="56" class="line" marker-end="url(#ar)"/>

    <!-- Step 2 · motion -->
    <g transform="translate(218,0)">
      <rect width="170" height="112" rx="10" fill="#211D1A" stroke="#2E2A27"/>
      <g class="icon" transform="translate(20,18)">
        <circle cx="13" cy="9.5" r="8"/>
        <path d="M10 9.5 L12.2 11.7 L16.4 7.3"/>
      </g>
      <text x="20" y="66" class="st">vibe-motion</text>
      <text x="20" y="86" class="std">逐页动效编排</text>
      <text x="20" y="102" class="std">节奏与转场设计</text>
    </g>

    <line x1="388" y1="56" x2="430" y2="56" class="line" marker-end="url(#ar)"/>

    <!-- Step 3 · video -->
    <g transform="translate(436,0)">
      <rect width="170" height="112" rx="10" fill="#211D1A" stroke="#2E2A27"/>
      <g class="icon" transform="translate(20,18)">
        <rect x="0" y="0" width="26" height="19" rx="2.5"/>
        <path d="M26 6 L33 1.5 V17.5 L26 13 Z"/>
      </g>
      <text x="20" y="66" class="st">deck-to-video</text>
      <text x="20" y="86" class="std">Remotion 合成</text>
      <text x="20" y="102" class="std">直接出成片</text>
    </g>
  </g>

  <!-- 底部状态 -->
  <line x1="56" y1="196" x2="1384" y2="196" stroke="#2E2A27"/>
  <g transform="translate(56,218)">
    <circle cx="5" cy="-4" r="3" fill="#7BA05B"/>
    <text x="14" y="0" class="std">SKILL 已上线 · ppt-deck</text>
    <g transform="translate(300,0)">
      <circle cx="5" cy="-4" r="3" fill="#57534E"/>
      <text x="14" y="0" class="std">IN PROGRESS · vibe-motion / deck-to-video</text>
    </g>
  </g>
</svg>
