<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕骑行记 — Pelican on a Bicycle</title>
  <!-- 内联 SVG Favicon 避免 404 并增添质感 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23f59e0b'/><path d='M30 45 Q50 30 75 35 Q85 55 55 65 Z' fill='%23ffffff'/><circle cx='45' cy='42' r='4' fill='%230f172a'/><path d='M50 42 L88 46 Q85 68 55 60 Z' fill='%23fbbf24'/></svg>">
  <style>
    :root {
      --bg-sky-top: #bae6fd;
      --bg-sky-mid: #e0f2fe;
      --bg-sky-bot: #fef3c7;
      --sea-top: #38bdf8;
      --sea-bot: #0284c7;
      --mountains-fill: #94a3b8;
      --ground-top: #475569;
      --ground-bot: #1e293b;
      --text-main: #0f172a;
      --panel-bg: rgba(255, 255, 255, 0.82);
      --panel-border: rgba(255, 255, 255, 0.65);
      --panel-shadow: 0 14px 40px -6px rgba(15, 23, 42, 0.16);
      --accent-color: #f59e0b;
      --accent-hover: #d97706;
      --font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    [data-theme="sunset"] {
      --bg-sky-top: #ea580c;
      --bg-sky-mid: #f43f5e;
      --bg-sky-bot: #fed7aa;
      --sea-top: #be185d;
      --sea-bot: #4c0519;
      --mountains-fill: #831843;
      --ground-top: #3f2536;
      --ground-bot: #1e111a;
      --text-main: #fff1f2;
      --panel-bg: rgba(50, 16, 34, 0.76);
      --panel-border: rgba(254, 215, 170, 0.3);
      --panel-shadow: 0 14px 40px -6px rgba(0, 0, 0, 0.45);
      --accent-color: #fb923c;
      --accent-hover: #ea580c;
    }

    [data-theme="night"] {
      --bg-sky-top: #030712;
      --bg-sky-mid: #0b1329;
      --bg-sky-bot: #1e293b;
      --sea-top: #0f172a;
      --sea-bot: #020617;
      --mountains-fill: #1e293b;
      --ground-top: #1e293b;
      --ground-bot: #090d16;
      --text-main: #f8fafc;
      --panel-bg: rgba(15, 23, 42, 0.82);
      --panel-border: rgba(255, 255, 255, 0.15);
      --panel-shadow: 0 16px 44px -6px rgba(0, 0, 0, 0.65);
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: var(--font-stack);
      background-color: var(--bg-sky-top);
      transition: background-color 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 全屏满幅无缝舞台 */
    .stage-wrapper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #stage-svg {
      width: 100%;
      height: 100%;
      display: block;
      /* slice 保证无论何种屏幕比例均横跨满屏无黑边 */
    }

    /* 悬浮控制面板 (Glassmorphism) */
    .controls-panel {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 22px;
      background: var(--panel-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--panel-border);
      border-radius: 9999px;
      box-shadow: var(--panel-shadow);
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
    }

    .controls-panel:hover {
      transform: translateX(-50%) translateY(-2px);
      box-shadow: 0 18px 46px -4px rgba(0, 0, 0, 0.28);
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ctrl-divider {
      width: 1px;
      height: 22px;
      background: var(--panel-border);
      opacity: 0.6;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 38px;
      padding: 0 16px;
      border: none;
      outline: none;
      border-radius: 9999px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.16);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: 1px solid transparent;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.32);
      transform: scale(1.05);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-accent {
      background: var(--accent-color);
      color: #ffffff !important;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
    }

    .btn-accent:hover {
      background: var(--accent-hover);
    }

    .btn-icon-only {
      width: 38px;
      padding: 0;
      border-radius: 50%;
    }

    .speed-slider-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
    }

    .speed-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100px;
      height: 6px;
      border-radius: 999px;
      background: rgba(125, 125, 125, 0.3);
      outline: none;
      cursor: pointer;
    }

    .speed-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent-color);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .speed-slider::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }

    /* 顶部徽章 */
    .top-badge {
      position: absolute;
      top: 24px;
      left: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      border-radius: 9999px;
      color: var(--text-main);
      z-index: 100;
      box-shadow: var(--panel-shadow);
      pointer-events: none;
    }

    .top-badge h1 {
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .top-badge span {
      font-size: 12px;
      opacity: 0.75;
      font-weight: 500;
    }

    .hotkey-tip {
      position: absolute;
      top: 24px;
      right: 28px;
      padding: 7px 16px;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      border-radius: 9999px;
      color: var(--text-main);
      font-size: 12px;
      font-weight: 500;
      z-index: 100;
      box-shadow: var(--panel-shadow);
      pointer-events: none;
    }

    /* 音符气泡 */
    .music-note {
      position: absolute;
      pointer-events: none;
      font-size: 26px;
      font-weight: bold;
      color: #f59e0b;
      animation: floatUp 1.25s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      z-index: 150;
      text-shadow: 0 2px 10px rgba(245, 158, 11, 0.6);
    }

    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0.5) rotate(-15deg);
      }
      20% {
        opacity: 1;
        transform: translateY(-30px) scale(1.25) rotate(12deg);
      }
      100% {
        opacity: 0;
        transform: translateY(-95px) scale(0.9) rotate(-22deg);
      }
    }

    /* 吐出跳跳鱼动画 */
    .fish-bubble {
      position: absolute;
      pointer-events: none;
      animation: fishJump 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      z-index: 160;
    }

    @keyframes fishJump {
      0% {
        opacity: 0;
        transform: translate(0, 0) scale(0.4) rotate(0deg);
      }
      25% {
        opacity: 1;
        transform: translate(45px, -75px) scale(1.15) rotate(40deg);
      }
      65% {
        transform: translate(105px, -95px) scale(1) rotate(90deg);
      }
      100% {
        opacity: 0;
        transform: translate(160px, 45px) scale(0.75) rotate(180deg);
      }
    }

    /* 移动端响应式适配 */
    @media (max-width: 768px) {
      .controls-panel {
        bottom: 16px;
        padding: 8px 14px;
        gap: 8px;
        max-width: 95vw;
        overflow-x: auto;
      }
      .top-badge, .hotkey-tip {
        display: none;
      }
      .btn {
        height: 34px;
        padding: 0 10px;
        font-size: 12px;
      }
      .speed-slider {
        width: 65px;
      }
    }
  </style>
</head>
<body data-theme="day">

  <!-- 舞台主体 -->
  <div class="stage-wrapper" id="stage-wrapper">
    <!-- 顶部状态信息 -->
    <div class="top-badge">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="5.5" cy="17.5" r="3.5"/>
        <circle cx="18.5" cy="17.5" r="3.5"/>
        <path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 11.5L9 9l3-3 4.5 5.5H20"/>
      </svg>
      <h1>鹈鹕的海滨骑行之旅</h1>
      <span>· 纯 SVG 骨骼动力学 2D 动画</span>
    </div>

    <!-- 快捷键指南 -->
    <div class="hotkey-tip">
      <b>空格</b> 按铃 · <b>N</b> 换昼夜 · <b>F</b> 喂鱼 · <b>↑/↓</b> 变速
    </div>

    <!-- 核心 SVG 矢量画布 (超宽视域设计，完全适配任何宽高比) -->
    <svg id="stage-svg" viewBox="-200 0 1600 680" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 天空渐变组 (日景/黄昏/夜景) -->
        <linearGradient id="skyGradDay" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#93c5fd" />
          <stop offset="55%" stop-color="#e0f2fe" />
          <stop offset="100%" stop-color="#fef3c7" />
        </linearGradient>

        <linearGradient id="skyGradSunset" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ea580c" />
          <stop offset="45%" stop-color="#f43f5e" />
          <stop offset="75%" stop-color="#fb923c" />
          <stop offset="100%" stop-color="#fed7aa" />
        </linearGradient>

        <linearGradient id="skyGradNight" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#030712" />
          <stop offset="50%" stop-color="#0b1329" />
          <stop offset="100%" stop-color="#1e293b" />
        </linearGradient>

        <!-- 海洋渐变 -->
        <linearGradient id="seaGradDay" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#38bdf8" />
          <stop offset="100%" stop-color="#0284c7" />
        </linearGradient>

        <linearGradient id="seaGradSunset" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#be185d" />
          <stop offset="100%" stop-color="#4c0519" />
        </linearGradient>

        <linearGradient id="seaGradNight" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#0f172a" />
          <stop offset="100%" stop-color="#020617" />
        </linearGradient>

        <!-- 道路沥青渐变 -->
        <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#475569" />
          <stop offset="18%" stop-color="#334155" />
          <stop offset="100%" stop-color="#1e293b" />
        </linearGradient>

        <!-- 车架复古英伦绿质感渐变 -->
        <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#3b7a57" />
          <stop offset="40%" stop-color="#5fa37e" />
          <stop offset="70%" stop-color="#2a5a3f" />
          <stop offset="100%" stop-color="#193b27" />
        </linearGradient>

        <!-- 亮银镀铬金属高光渐变 -->
        <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#cbd5e1" />
          <stop offset="35%" stop-color="#ffffff" />
          <stop offset="65%" stop-color="#94a3b8" />
          <stop offset="100%" stop-color="#64748b" />
        </linearGradient>

        <!-- 复古皮革座垫渐变 -->
        <linearGradient id="saddleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#a16207" />
          <stop offset="45%" stop-color="#78350f" />
          <stop offset="100%" stop-color="#451a03" />
        </linearGradient>

        <!-- 鹈鹕嘴部琥珀渐变 -->
        <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="30%">
          <stop offset="0%" stop-color="#fbbf24" />
          <stop offset="50%" stop-color="#f59e0b" />
          <stop offset="100%" stop-color="#ea580c" />
        </linearGradient>

        <!-- 喉囊半透明果冻肉粉橙 -->
        <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="40%" y2="100%">
          <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.95" />
          <stop offset="45%" stop-color="#fdba74" stop-opacity="0.9" />
          <stop offset="100%" stop-color="#fb923c" stop-opacity="0.85" />
        </linearGradient>

        <!-- 鹈鹕羽毛白暖灰渐变 -->
        <linearGradient id="featherGrad" x1="0%" y1="0%" x2="25%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="70%" stop-color="#f8fafc" />
          <stop offset="100%" stop-color="#e2e8f0" />
        </linearGradient>

        <!-- 翅膀飞羽渐变 -->
        <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="60%" stop-color="#cbd5e1" />
          <stop offset="100%" stop-color="#475569" />
        </linearGradient>

        <!-- 车前灯光束 -->
        <radialGradient id="headlightBeam" cx="0%" cy="50%" r="100%">
          <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
          <stop offset="35%" stop-color="#fde047" stop-opacity="0.38" />
          <stop offset="75%" stop-color="#fef9c3" stop-opacity="0.12" />
          <stop offset="100%" stop-color="#fde047" stop-opacity="0" />
        </radialGradient>

        <!-- 太阳柔和辉光 -->
        <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
          <stop offset="40%" stop-color="#fde047" stop-opacity="0.85" />
          <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
        </radialGradient>
      </defs>

      <!-- 1. 超宽天空背景矩形 -->
      <rect id="sky-rect" x="-300" y="0" width="1800" height="480" fill="url(#skyGradDay)" />

      <!-- 太阳与月亮天体组 -->
      <g id="celestial-group" transform="translate(1000, 110)">
        <!-- 太阳 -->
        <g id="sun-element">
          <circle cx="0" cy="0" r="75" fill="url(#sunGlow)" />
          <circle cx="0" cy="0" r="35" fill="#fbbf24" />
        </g>
        <!-- 月亮 (夜景) -->
        <g id="moon-element" opacity="0">
          <circle cx="0" cy="0" r="34" fill="#f8fafc" />
          <circle cx="12" cy="-7" r="28" fill="#0b1329" />
          <circle cx="-12" cy="8" r="4.5" fill="#cbd5e1" opacity="0.35" />
          <circle cx="2" cy="15" r="6" fill="#cbd5e1" opacity="0.25" />
        </g>
      </g>

      <!-- 繁星夜空层 -->
      <g id="stars-layer" opacity="0"></g>

      <!-- 2. 远景海面与远山 -->
      <g id="mountains-layer" opacity="0.85"></g>

      <!-- 海面波浪层 -->
      <rect id="sea-rect" x="-300" y="380" width="1800" height="90" fill="url(#seaGradDay)" opacity="0.8" />
      <g id="sea-waves-layer"></g>

      <!-- 远景海岛与灯塔 -->
      <g id="island-lighthouse" transform="translate(140, 360)">
        <path d="M -50,28 Q 0,10 50,28 Z" fill="#334155" opacity="0.75" />
        <polygon points="-7,25 7,25 4,-2 10,-4 10,-8 -10,-8 -10,-4 -4,-2" fill="#f8fafc" />
        <rect x="-7" y="7" width="14" height="6" fill="#ef4444" />
        <polygon points="-9,-8 0,-20 9,-8" fill="#dc2626" />
        <polygon id="lighthouse-beam" points="0,-14 420,-70 440,50" fill="#fef08a" opacity="0" />
      </g>

      <!-- 飞翔海鸥群 -->
      <g id="seagulls-group"></g>

      <!-- 3. 中景层：沿海护栏、棕榈树与海滨路灯 -->
      <g id="midground-fence"></g>
      <g id="midground-palms"></g>
      <g id="midground-lamps"></g>

      <!-- 4. 近景层：路缘石与沥青马路 -->
      <rect id="curb-rect" x="-300" y="465" width="1800" height="15" fill="#e2e8f0" />
      <line x1="-300" y1="465" x2="1500" y2="465" stroke="#cbd5e1" stroke-width="2" />
      <rect x="-300" y="480" width="1800" height="200" fill="url(#roadGrad)" />
      <!-- 道路白色虚线 -->
      <g id="road-lines-group"></g>

      <!-- 5. 鹈鹕与自行车的地面动态投影 -->
      <ellipse id="ground-shadow" cx="585" cy="552" rx="150" ry="12" fill="#0b1329" opacity="0.32" />

      <!-- ==============================================
           6. 角色与自行车主总成 (Pelican & Bicycle Assembly)
           ============================================== -->
      <g id="pelican-bike-rig" transform="translate(0, 0)">

        <!-- 车前灯投射的扇形光锥 (夜间模式亮起) -->
        <polygon id="headlight-beam-cone" points="726,432 1400,310 1400,640 726,448" fill="url(#headlightBeam)" opacity="0" pointer-events="none" />

        <!-- ---------------------------------
             6.1 远侧脚踏与腿部 (Far Leg & Pedal, 纯 IK 计算)
             --------------------------------- -->
        <g id="far-pedal-group">
          <!-- 远侧曲柄臂 -->
          <line id="far-crank-arm" x1="530" y1="465" x2="505" y2="485" stroke="#64748b" stroke-width="6.5" stroke-linecap="round" />
          <!-- 远侧脚踏板 -->
          <rect id="far-pedal-plate" x="492" y="482" width="24" height="6.5" rx="3.2" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
        </g>

        <!-- 远侧腿部与脚蹼 (暗色阴影层，IK 实时驱动) -->
        <g id="far-leg-group">
          <path id="far-leg-thigh" d="M 470,380 L 490,430" stroke="#d97706" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.65" />
          <path id="far-leg-shin" d="M 490,430 L 505,485" stroke="#b45309" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.75" />
          <polygon id="far-foot-web" points="505,485 528,482 530,489 500,489" fill="#92400e" opacity="0.8" />
        </g>

        <!-- ---------------------------------
             6.2 自行车主体框架 (Bicycle Frame & Wheels)
             --------------------------------- -->
        <!-- 后轮总成 (中心约 410, 475) -->
        <g id="rear-wheel-assembly" transform="translate(410, 475)">
          <circle cx="0" cy="0" r="75" fill="none" stroke="#1e293b" stroke-width="14" />
          <circle cx="0" cy="0" r="68" fill="none" stroke="#f8fafc" stroke-width="4.5" />
          <circle cx="0" cy="0" r="66" fill="none" stroke="url(#chromeGrad)" stroke-width="5" />
          <!-- 高速旋转辐条组 -->
          <g id="rear-spokes-group"></g>
          <circle cx="0" cy="0" r="9" fill="url(#chromeGrad)" stroke="#334155" stroke-width="2" />
          <circle cx="0" cy="0" r="3" fill="#0f172a" />
        </g>

        <!-- 前轮总成 (中心约 690, 475) -->
        <g id="front-wheel-assembly" transform="translate(690, 475)">
          <circle cx="0" cy="0" r="75" fill="none" stroke="#1e293b" stroke-width="14" />
          <circle cx="0" cy="0" r="68" fill="none" stroke="#f8fafc" stroke-width="4.5" />
          <circle cx="0" cy="0" r="66" fill="none" stroke="url(#chromeGrad)" stroke-width="5" />
          <g id="front-spokes-group"></g>
          <circle cx="0" cy="0" r="9" fill="url(#chromeGrad)" stroke="#334155" stroke-width="2" />
          <circle cx="0" cy="0" r="3" fill="#0f172a" />
        </g>

        <!-- 挡泥板 -->
        <!-- 后轮圆弧挡泥板 -->
        <path d="M 338,475 A 77 77 0 0 1 475,410" fill="none" stroke="url(#frameGrad)" stroke-width="8" stroke-linecap="round" />

      // ==========================================
      // Web Audio 车铃声音合成
      // ==========================================
      let audioCtx = null;
      function playBellSound() {
        try {
          if (!audioCtx) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContextClass();
          }
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }

          const now = audioCtx.currentTime;
          const freqs = [2250, 3180];
          freqs.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.exponentialRampToValueAtTime(freq * 0.985, now + 0.8);

            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.25 / (idx + 1), now + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.95);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 1.0);
          });

          // 第二声清脆余音
          setTimeout(() => {
            if (!audioCtx) return;
            const t2 = audioCtx.currentTime;
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(3250, t2);
            gain2.gain.setValueAtTime(0, t2);
            gain2.gain.linearRampToValueAtTime(0.2, t2 + 0.01);
            gain2.gain.exponentialRampToValueAtTime(0.0001, t2 + 0.85);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(t2);
            osc2.stop(t2 + 0.9);
          }, 110);

        } catch (e) {
          console.warn('Web Audio 播放受限:', e);
        }

        triggerBellVisual();
      }

      // ==========================================
      // 2-Bone 反向运动学 (IK) 解算
      // ==========================================
      function solve2BoneIK(hip, target, l1, l2, bendDir = 1) {
        const dx = target.x - hip.x;
        const dy = target.y - hip.y;
        const dist = Math.hypot(dx, dy);

        const clampedDist = Math.max(10, Math.min(dist, l1 + l2 - 1.5));
        const baseAngle = Math.atan2(dy, dx);

        const cosAngle = (l1 * l1 + clampedDist * clampedDist - l2 * l2) / (2 * l1 * clampedDist);
        const safeCos = Math.max(-1, Math.min(1, cosAngle));
        const angleOffset = Math.acos(safeCos);

        const kneeAngle = baseAngle - bendDir * angleOffset;
        const knee = {
          x: hip.x + l1 * Math.cos(kneeAngle),
          y: hip.y + l1 * Math.sin(kneeAngle),
        };

        return { knee };
      }

      // ==========================================
      // 动画与动力学渲染主循环 (60fps)
      // ==========================================
      let lastTime = performance.now();

      function updateAnimation(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;

        if (state.isPlaying) {
          const speed = state.speedFactor;

          // 踏板与车轮旋转
          const angularSpeed = 4.2 * speed;
          state.theta = (state.theta + angularSpeed * dt) % (Math.PI * 2);
          state.wheelTheta = (state.wheelTheta + angularSpeed * 1.5 * dt) % (Math.PI * 2);

          // 身体自然微颠簸 (Bounce)
          const bounceFactor = Math.sin(state.theta * 2);
          state.bounceY = bounceFactor * 3.5;
          pelicanRig.setAttribute('transform', `translate(0, ${state.bounceY.toFixed(2)})`);

          // 地面投影同步微变
          const shadowScale = 1 - bounceFactor * 0.05;
          groundShadow.setAttribute('rx', (150 * shadowScale).toFixed(1));
          groundShadow.setAttribute('opacity', (0.32 + bounceFactor * 0.04).toFixed(2));

          // 车筐内向日葵轻跳
          basketSunflower.setAttribute('transform', `translate(4, ${(-18 + bounceFactor * 1.8).toFixed(1)})`);

          // 车轮辐条转动
          const deg = (state.wheelTheta * 180 / Math.PI).toFixed(1);
          rearSpokesGroup.setAttribute('transform', `rotate(${deg})`);
          frontSpokesGroup.setAttribute('transform', `rotate(${deg})`);

          // 中轴与脚踏板坐标
          const cx = GEOM.bottomBracket.x;
          const cy = GEOM.bottomBracket.y;
          const r = GEOM.crankLength;

          // 近侧脚踏 (Near)
          const nearPedalX = cx + r * Math.cos(state.theta);
          const nearPedalY = cy + r * Math.sin(state.theta);

          // 远侧脚踏 (Far, 180° 相位差)
          const farPedalX = cx + r * Math.cos(state.theta + Math.PI);
          const farPedalY = cy + r * Math.sin(state.theta + Math.PI);

          // 更新近侧与远侧曲柄和踏板平台
          nearCrankArm.setAttribute('x2', nearPedalX.toFixed(1));
          nearCrankArm.setAttribute('y2', nearPedalY.toFixed(1));
          nearPedalPlate.setAttribute('transform', `translate(${nearPedalX.toFixed(1)}, ${nearPedalY.toFixed(1)})`);

          farCrankArm.setAttribute('x2', farPedalX.toFixed(1));
          farCrankArm.setAttribute('y2', farPedalY.toFixed(1));
          farPedalPlate.setAttribute('x', (farPedalX - 12).toFixed(1));
          farPedalPlate.setAttribute('y', (farPedalY - 3.2).toFixed(1));

          // 髋关节基础位置 (坐在车座上，随颠簸微动)
          const currentHip = {
            x: GEOM.hipJoint.x,
            y: GEOM.hipJoint.y + state.bounceY * 0.35,
          };

          // --- 近侧腿 IK ---
          const nearTarget = { x: nearPedalX, y: nearPedalY };
          const { knee: nearKnee } = solve2BoneIK(currentHip, nearTarget, GEOM.thighLen, GEOM.shinLen, 1);

          nearLegThigh.setAttribute('d', `M ${currentHip.x.toFixed(1)},${currentHip.y.toFixed(1)} Q ${(currentHip.x + nearKnee.x) / 2 + 5},${(currentHip.y + nearKnee.y) / 2} ${nearKnee.x.toFixed(1)},${nearKnee.y.toFixed(1)}`);
          nearLegShin.setAttribute('d', `M ${nearKnee.x.toFixed(1)},${nearKnee.y.toFixed(1)} L ${nearPedalX.toFixed(1)},${nearPedalY.toFixed(1)}`);

          const pedalTilt = Math.sin(state.theta) * 0.18;
          const footAngle = pedalTilt * 180 / Math.PI;
          nearFootGroup.setAttribute('transform', `translate(${nearPedalX.toFixed(1)}, ${nearPedalY.toFixed(1)}) rotate(${footAngle.toFixed(1)}) translate(${-nearPedalX.toFixed(1)}, ${-nearPedalY.toFixed(1)})`);

          const footW = 28;
          nearFootPolygon.setAttribute('points', `
            ${nearPedalX - 8},${nearPedalY - 2}
            ${nearPedalX + footW},${nearPedalY - 5}
            ${nearPedalX + footW + 4},${nearPedalY + 4}
            ${nearPedalX - 6},${nearPedalY + 5}
          `);
          nearFootWeb1.setAttribute('x1', (nearPedalX - 6).toFixed(1));
          nearFootWeb1.setAttribute('y1', (nearPedalY).toFixed(1));
          nearFootWeb1.setAttribute('x2', (nearPedalX + footW).toFixed(1));
          nearFootWeb1.setAttribute('y2', (nearPedalY - 5).toFixed(1));
          nearFootWeb2.setAttribute('x1', (nearPedalX - 6).toFixed(1));
          nearFootWeb2.setAttribute('y1', (nearPedalY).toFixed(1));
          nearFootWeb2.setAttribute('x2', (nearPedalX + footW + 4).toFixed(1));
          nearFootWeb2.setAttribute('y2', (nearPedalY + 4).toFixed(1));

          // --- 远侧腿 IK (双腿交替蹬踏完全闭环) ---
          const farHip = { x: currentHip.x - 4, y: currentHip.y - 3 };
          const farTarget = { x: farPedalX, y: farPedalY };
          const { knee: farKnee } = solve2BoneIK(farHip, farTarget, GEOM.thighLen, GEOM.shinLen, 1);

          farLegThigh.setAttribute('d', `M ${farHip.x.toFixed(1)},${farHip.y.toFixed(1)} Q ${(farHip.x + farKnee.x) / 2 + 3},${(farHip.y + farKnee.y) / 2} ${farKnee.x.toFixed(1)},${farKnee.y.toFixed(1)}`);
          farLegShin.setAttribute('d', `M ${farKnee.x.toFixed(1)},${farKnee.y.toFixed(1)} L ${farPedalX.toFixed(1)},${farPedalY.toFixed(1)}`);

          const farFootAngle = Math.sin(state.theta + Math.PI) * 0.18 * 180 / Math.PI;
          farFootWeb.setAttribute('points', `
            ${farPedalX - 7},${farPedalY - 2}
            ${farPedalX + 24},${farPedalY - 4}
            ${farPedalX + 26},${farPedalY + 4}
            ${farPedalX - 5},${farPedalY + 4}
          `);

          // 围巾流线型飘扬 (贝塞尔动态波浪)
          const timeSec = now * 0.005 * speed;
          const wave1 = Math.sin(timeSec) * 12;
          const wave2 = Math.cos(timeSec * 1.3) * 16;
          scarfTail1.setAttribute('d', `M 522,228 Q 470,${(212 + wave1).toFixed(1)} 415,${(230 + wave2).toFixed(1)} T ${(350 - speed * 8).toFixed(1)},${(222 - wave1).toFixed(1)}`);
          scarfTail1Stripe.setAttribute('d', scarfTail1.getAttribute('d'));

          const wave3 = Math.cos(timeSec * 1.1) * 10;
          scarfTail2.setAttribute('d', `M 526,234 Q 465,${(236 + wave3).toFixed(1)} ${(405 - speed * 6).toFixed(1)},${(256 - wave2).toFixed(1)}`);
          scarfTail2Stripe.setAttribute('d', scarfTail2.getAttribute('d'));

          // 呆毛微颤
          const crestWave = Math.sin(timeSec * 1.8) * 4;
          headCrest.setAttribute('d', `M -8,-16 Q ${(-22 + crestWave).toFixed(1)},-32 ${(-10 + crestWave * 1.5).toFixed(1)},-40 Q -4,-28 -2,-18`);

          // 喉囊果冻弹性
          if (!state.isFishJumping) {
            state.pouchStretch = 1.0 + Math.sin(state.theta * 2 + 0.8) * 0.045 * speed;
          } else {
            state.pouchStretch += (1.0 - state.pouchStretch) * 0.08;
          }
          const pouchD = `M 12,6 Q 48,6 94,8 Q 88,${(64 * state.pouchStretch).toFixed(1)} 32,${(56 * state.pouchStretch).toFixed(1)} Q 0,44 -4,22 Z`;
          pelicanPouch.setAttribute('d', pouchD);

          // 眨眼动画
          state.blinkProgress--;
          if (state.blinkProgress <= 0) {
            state.nextBlink = 140 + Math.random() * 180;
            state.blinkProgress = state.nextBlink;
          }
          if (state.blinkProgress < 8) {
            eyeLid.setAttribute('opacity', '1');
          } else {
            eyeLid.setAttribute('opacity', '0');
          }

          // 视差背景无缝横移 (无界横移)
          parallaxObjects.roadDashes.forEach(item => {
            item.x -= item.speed * speed;
            if (item.x < -300) item.x += 1800;
            item.el.setAttribute('x', item.x.toFixed(1));
          });

          parallaxObjects.palms.forEach(item => {
            item.x -= item.speed * speed;
            if (item.x < -350) item.x += 1750;
            item.el.setAttribute('transform', `translate(${item.x.toFixed(1)}, 370)`);
          });

          parallaxObjects.lamps.forEach(item => {
            item.x -= item.speed * speed;
            if (item.x < -300) item.x += 1750;
            item.el.setAttribute('transform', `translate(${item.x.toFixed(1)}, 345)`);
          });

          parallaxObjects.seagulls.forEach(bird => {
            bird.x -= bird.speed * speed;
            bird.flapPhase += 0.12;
            if (bird.x < -200) {
              bird.x = 1500;
              bird.y = 120 + Math.random() * 80;
            }
            const flap = Math.sin(bird.flapPhase) * 10;
            bird.el.setAttribute('d', `M -18,${(4 + flap).toFixed(1)} Q -9,${(-12 - flap).toFixed(1)} 0,0 Q 9,${(-12 - flap).toFixed(1)} 18,${(4 + flap).toFixed(1)}`);
            bird.el.setAttribute('transform', `translate(${bird.x.toFixed(1)}, ${bird.y.toFixed(1)})`);
          });

          parallaxObjects.windLines.forEach(w => {
            w.x -= w.speed * speed;
            if (w.x < -300) {
              w.x = 1500 + Math.random() * 200;
              w.y = 180 + Math.random() * 320;
            }
            w.el.setAttribute('x1', w.x.toFixed(1));
            w.el.setAttribute('x2', (w.x + w.len).toFixed(1));
            w.el.setAttribute('y1', w.y.toFixed(1));
            w.el.setAttribute('y2', w.y.toFixed(1));
          });

          // 灯塔光束扫动
          if (state.currentTheme !== 'day') {
            const rot = (now * 0.04) % 360;
            const beamAlpha = (Math.sin(rot * Math.PI / 180) + 1) * 0.28;
            lighthouseBeam.setAttribute('opacity', beamAlpha.toFixed(2));
          }
        }

        requestAnimationFrame(updateAnimation);
      }

      // ==========================================
      // 昼夜场景切换逻辑 (支持渐变引用切换)
      // ==========================================
      function setTheme(theme) {
        state.currentTheme = theme;
        document.body.setAttribute('data-theme', theme);

        const lampGlows = document.querySelectorAll('.lamp-glow');

        if (theme === 'day') {
          skyRect.setAttribute('fill', 'url(#skyGradDay)');
          seaRect.setAttribute('fill', 'url(#seaGradDay)');
          sunElement.setAttribute('opacity', '1');
          moonElement.setAttribute('opacity', '0');
          starsLayer.setAttribute('opacity', '0');
          headlightBeamCone.setAttribute('opacity', '0');
          lighthouseBeam.setAttribute('opacity', '0');
          lampGlows.forEach(el => el.setAttribute('opacity', '0'));
          themeIcon.innerHTML = `
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          `;
        } else if (theme === 'sunset') {
          skyRect.setAttribute('fill', 'url(#skyGradSunset)');
          seaRect.setAttribute('fill', 'url(#seaGradSunset)');
          sunElement.setAttribute('opacity', '0.9');
          moonElement.setAttribute('opacity', '0');
          starsLayer.setAttribute('opacity', '0.2');
          headlightBeamCone.setAttribute('opacity', '0.25');
          lighthouseBeam.setAttribute('opacity', '0.2');
          lampGlows.forEach(el => el.setAttribute('opacity', '0.25'));
          themeIcon.innerHTML = `
            <path d="M12 10V2M4.93 10.93l1.41-1.41M2 18h2M20 18h2M17.66 9.52l1.41 1.41"/>
            <path d="M22 22H2"/>
            <path d="M8 6l4-4 4 4"/>
            <path d="M16 18a4 4 0 0 0-8 0"/>
          `;
        } else if (theme === 'night') {
          skyRect.setAttribute('fill', 'url(#skyGradNight)');
          seaRect.setAttribute('fill', 'url(#seaGradNight)');
          sunElement.setAttribute('opacity', '0');
          moonElement.setAttribute('opacity', '1');
          starsLayer.setAttribute('opacity', '0.85');
          headlightBeamCone.setAttribute('opacity', '0.8');
          lighthouseBeam.setAttribute('opacity', '0.5');
          lampGlows.forEach(el => el.setAttribute('opacity', '0.75'));
          themeIcon.innerHTML = `
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          `;
        }
      }

      function toggleTheme() {
        const idx = state.themes.indexOf(state.currentTheme);
        const nextTheme = state.themes[(idx + 1) % state.themes.length];
        setTheme(nextTheme);
      }

      // ==========================================
      // 事件监听与快捷键
      // ==========================================
      btnTogglePlay.addEventListener('click', () => {
        state.isPlaying = !state.isPlaying;
        if (state.isPlaying) {
          iconPlayState.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
          btnTogglePlay.title = '暂停 (P)';
        } else {
          iconPlayState.innerHTML = '<path d="M8 5v14l11-7z"/>';
          btnTogglePlay.title = '播放 (P)';
        }
      });

      speedRange.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        state.speedFactor = val;
        speedLabel.textContent = `${val.toFixed(1)}x`;
      });

      btnRingBell.addEventListener('click', playBellSound);
      bikeBellButton.addEventListener('click', (e) => {
        e.stopPropagation();
        playBellSound();
      });

      btnFeedFish.addEventListener('click', triggerFishJump);
      pouchContainer.addEventListener('click', (e) => {
        e.stopPropagation();
        triggerFishJump();
      });

      btnThemeToggle.addEventListener('click', toggleTheme);

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'KeyB') {
          e.preventDefault();
          playBellSound();
        } else if (e.code === 'KeyP') {
          e.preventDefault();
          btnTogglePlay.click();
        } else if (e.code === 'KeyN') {
          e.preventDefault();
          toggleTheme();
        } else if (e.code === 'KeyF') {
          e.preventDefault();
          triggerFishJump();
        } else if (e.code === 'ArrowUp') {
          e.preventDefault();
          const newVal = Math.min(2.6, state.speedFactor + 0.2);
          speedRange.value = newVal;
          speedRange.dispatchEvent(new Event('input'));
        } else if (e.code === 'ArrowDown') {
          e.preventDefault();
          const newVal = Math.max(0.3, state.speedFactor - 0.2);
          speedRange.value = newVal;
          speedRange.dispatchEvent(new Event('input'));
        }
      });

      // 初始化启动
      initSpokes();
      initStars();
      initMountains();
      initPalms();
      initLamps();
      initFences();
      initRoadLines();
      initSeagulls();
      initWindLines();
      setTheme('day');

      requestAnimationFrame(updateAnimation);

    })();
  </script>
</body>
</html>
