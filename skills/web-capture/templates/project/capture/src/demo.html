<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Capture fixture</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e7eee8}svg{width:100%;height:100%}text{font-family:Arial,"Microsoft YaHei",sans-serif}</style>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
<rect x="100" y="100" width="1080" height="520" rx="40" fill="#f6f4ec"/>
<path d="M160 490 Q640 170 1120 490" fill="none" stroke="#b8c7c0" stroke-width="4"/>
<circle id="subject" cx="160" cy="490" r="55" fill="#3157f6"/>
<text x="160" y="200" font-size="32" fill="#273a32">DETERMINISTIC CAPTURE FIXTURE</text>
<text id="clock" x="160" y="265" font-size="46" fill="#273a32">0.00 s</text>
<text x="160" y="570" font-size="24" fill="#53675d">Explicit seek · no external fonts or media</text>
</svg><script>
window.__captureSeek = (ms) => {
  const p=(ms/6000)%1;
  const subject=document.getElementById('subject');
  subject.setAttribute('cx',160+960*p);subject.setAttribute('cy',490-640*p*(1-p));
  document.getElementById('clock').textContent=(ms/1000).toFixed(2)+' s';
};window.__captureSeek(0);
</script></html>
