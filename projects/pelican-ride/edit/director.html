<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>pelican-ride · director</title>
<style>
  /* =====================================================================
     鹈鹕骑行 · Codex 实录 — 印刷图鉴风版式系统（第二版）
     色板对齐源页本身（--paper #F6F5ED / --ink #344942 / --accent #AE583E），
     生成物与它的展示容器共用一套印刷语言。
     规则不变：叙事走浅色纸面，只有结论页翻转墨底；平涂、无发光、无圆角胶囊。
     ===================================================================== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #F6F5ED; }

  #viewport {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    --paper:   #F6F5ED;
    --paper-2: #ECEBE0;
    --paper-3: #DFDFCF;
    --ink:     #344942;
    --ink-2:   #52655C;
    --ink-3:   #7E8F84;
    --rule:    rgba(52, 73, 66, 0.20);
    --rule-2:  rgba(52, 73, 66, 0.44);
    --hot:     #AE583E;   /* 源页锈红 */
    --sage:    #A8C2AC;
    --sea:     #A6CBC1;
    background: var(--paper);
  }
  #viewport.is-dark {
    --paper:   #1C2420;
    --paper-2: #26312B;
    --paper-3: #33403A;
    --ink:     #EFF0E4;
    --ink-2:   #C4CCC0;
    --ink-3:   #8B968C;
    --rule:    rgba(239, 240, 228, 0.22);
    --rule-2:  rgba(239, 240, 228, 0.48);
    --hot:     #D98A6C;
    --sage:    #A8C2AC;
    --sea:     #8FBFB4;
  }
  #bed { position: absolute; inset: 0; display: block; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }

  /* ---------- 书眉：全片常驻，平台身份靠排版扛 ---------- */
  .head {
    position: absolute; left: 72px; right: 72px; top: 22px; height: 30px;
    display: flex; align-items: baseline; justify-content: space-between;
    font-family: 'Noto Sans SC', 'Microsoft YaHei UI', sans-serif;
    font-size: 19px; letter-spacing: 0.14em; color: var(--ink-3);
  }
  .head b { font-weight: 500; color: var(--ink-2); }
  .headrule { position: absolute; left: 0; right: 0; top: 64px; height: 1px; background: var(--rule); transform-origin: left center; }

  /* ---------- 页脚字幕带：实心纸面 ---------- */
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 128px; }
  .bandrule { position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--rule); }
  .band-inner { position: absolute; left: 72px; right: 72px; top: 20px; }
  .band-top {
    display: flex; align-items: baseline; justify-content: space-between;
    font-family: 'Noto Sans SC', sans-serif; font-size: 18px;
    letter-spacing: 0.16em; color: var(--ink-3); height: 26px;
  }
  .band-kicker { color: var(--hot); font-weight: 500; }
  .cap {
    margin-top: 6px;
    font-family: 'Noto Sans SC Medium', 'Noto Sans SC', sans-serif;
    font-size: 44px; line-height: 1.14; letter-spacing: 0.01em; color: var(--ink);
  }

  /* ---------- 页面版心 ---------- */
  .page { position: absolute; left: 72px; right: 72px; top: 118px; bottom: 128px; }
  .page.cols { display: flex; gap: 84px; }
  .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
  .rail { flex: 0 0 600px; padding-top: 6px; }
  .rail.narrow { flex: 0 0 480px; }

  /* ---------- 章节 folio：右上角小字，随单元走 ---------- */
  .folio {
    position: absolute; right: 72px; top: 84px;
    font-family: 'Noto Sans SC', sans-serif; font-size: 15px;
    letter-spacing: 0.3em; color: var(--ink-3);
  }

  /* ---------- 内容提要：填住页面下半，同时交代看点 ---------- */
  .agenda { margin-top: auto; padding-top: 22px; border-top: 1px solid var(--rule); width: 100%; max-width: 1000px; }
  .agenda-t {
    font-family: 'Noto Sans SC', sans-serif; font-size: 18px;
    letter-spacing: 0.2em; color: var(--ink-3); margin-bottom: 15px;
  }
  .agenda-r { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; }
  .agenda-n {
    font-family: 'Noto Serif SC Black', 'Noto Serif SC', serif; font-weight: 900;
    font-size: 21px; color: var(--hot); width: 34px; flex: none;
  }
  .agenda-v { font-family: 'Noto Sans SC', sans-serif; font-size: 27px; color: var(--ink-2); }

  /* ---------- 印刷件例 v2：书脊竖排 / 图版编号 / 印章 ---------- */
  .spine {
    position: absolute; right: 20px; top: 150px; bottom: 150px;
    writing-mode: vertical-rl;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Noto Sans SC', sans-serif; font-size: 13px;
    letter-spacing: 0.52em; color: var(--ink-3);
  }
  .figlabel { position: absolute; left: 26px; top: 84px; display: flex; align-items: baseline; gap: 12px; }
  .figlabel i {
    font-family: 'Noto Serif SC', Georgia, serif; font-style: italic;
    font-size: 23px; color: #344942;
  }
  .figlabel b {
    font-family: 'Noto Sans SC', sans-serif; font-weight: 400;
    font-size: 14px; letter-spacing: 0.2em; color: rgba(52, 73, 66, 0.72);
  }
  .stamp {
    position: absolute; border: 3px solid var(--hot); color: var(--hot);
    padding: 6px 16px; transform: rotate(-6deg); opacity: 0.94;
    font-family: 'Noto Serif SC Black', 'Noto Serif SC', serif; font-weight: 900;
    font-size: 30px; letter-spacing: 0.3em; text-indent: 0.3em;
  }
  .seal {
    display: inline-block; border: 2px solid var(--hot); color: var(--hot);
    padding: 8px 20px; transform: rotate(-2deg);
    font-family: 'Noto Serif SC Black', 'Noto Serif SC', serif; font-weight: 900;
  }

  /* ---------- 提示词引用卡：实心纸片 + 左侧锈红 stoodge ---------- */
  .quote {
    margin-top: 40px; max-width: 1000px;
    background: var(--paper-2); border-left: 6px solid var(--hot);
    padding: 30px 36px;
    font-family: 'Noto Serif SC Medium', 'Noto Serif SC', serif;
    font-size: 40px; line-height: 1.6; color: var(--ink);
  }

  /* ---------- 标题与正文 ---------- */
  .kicker {
    font-family: 'Noto Sans SC Medium', 'Noto Sans SC', sans-serif;
    font-size: 26px; letter-spacing: 0.04em; color: var(--hot); margin-bottom: 26px;
  }
  .display {
    font-family: 'Noto Serif SC Black', 'Noto Serif SC', serif; font-weight: 900;
    font-size: 132px; line-height: 1.1; letter-spacing: -0.015em; color: var(--ink);
  }
  .display.sm { font-size: 104px; }
  .display.xl { font-size: 168px; }
  .display em { font-style: normal; color: var(--hot); }
  .rule { height: 6px; width: 168px; background: var(--hot); margin: 34px 0 30px; }
  .prose {
    font-family: 'Noto Sans SC', 'Microsoft YaHei UI', sans-serif;
    font-size: 33px; line-height: 1.72; color: var(--ink-2); max-width: 1020px;
  }
  .prose + .prose { margin-top: 4px; }
  .foot {
    font-family: 'Noto Sans SC', sans-serif; font-size: 21px;
    letter-spacing: 0.06em; color: var(--ink-3); margin-top: 30px;
    padding-top: 16px; border-top: 1px solid var(--rule);
  }

  /* ---------- 规格表：点线引导（点线画入是确定性动画） ---------- */
  .table { width: 100%; }
  .trow { display: flex; align-items: baseline; padding: 13px 0; border-bottom: 1px solid var(--rule); }
  .trow:first-child { border-top: 1px solid var(--rule); }
  .tk {
    font-family: 'Noto Sans SC', sans-serif; font-size: 21px; letter-spacing: 0.1em;
    color: var(--ink-3); white-space: nowrap;
  }
  .tdots { flex: 1 1 auto; border-bottom: 2px dotted var(--rule-2); margin: 0 16px 7px; min-width: 24px; transform-origin: left center; }
  .tv {
    font-family: 'Noto Sans SC Medium', 'Noto Sans SC', sans-serif; font-size: 27px;
    color: var(--ink); white-space: nowrap;
  }
  .tv.hot { color: var(--hot); }

  /* ---------- 生成清单 ---------- */
  .facts { width: 100%; max-width: 1180px; }
  .check { display: flex; align-items: baseline; gap: 18px; padding: 15px 0; border-bottom: 1px solid var(--rule); }
  .check:first-child { border-top: 1px solid var(--rule); }
  .check i {
    font-style: normal; font-family: 'Noto Sans SC Medium', sans-serif;
    font-size: 24px; color: var(--hot); width: 30px; flex: none;
  }
  .check.num i { width: 46px; font-size: 23px; letter-spacing: 0.02em; }
  .check-k {
    font-family: 'Noto Sans SC Medium', sans-serif; font-size: 23px;
    letter-spacing: 0.08em; color: var(--ink-3); width: 96px; flex: none;
  }
  .check-v { font-family: 'Noto Sans SC', sans-serif; font-size: 29px; color: var(--ink-2); }
  .stat {
    font-family: 'Noto Serif SC Black', 'Noto Serif SC', serif; font-weight: 900;
    font-size: 168px; line-height: 0.94; color: var(--hot); text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .stat-l {
    font-family: 'Noto Sans SC', sans-serif; font-size: 20px; letter-spacing: 0.16em;
    color: var(--ink-3); text-align: right; margin-top: 14px;
  }

  /* ---------- 印刷体标注：实心纸片 + 引线 ---------- */
  .note { position: absolute; display: flex; align-items: center; }
  .note-dot {
    width: 13px; height: 13px; flex: none; background: var(--hot);
    outline: 3px solid rgba(174, 88, 62, 0.22);
  }
  .note-line { height: 1px; flex: none; background: var(--ink); opacity: 0.55; }
  .note-label {
    font-family: 'Noto Sans SC Medium', 'Noto Sans SC', sans-serif; font-size: 22px;
    color: var(--ink); background: var(--paper); padding: 8px 15px;
    border: 1px solid var(--rule-2); white-space: nowrap;
  }

  /* ---------- 对照页 ---------- */
  .plate-label { position: absolute; display: flex; flex-direction: column; gap: 7px; }
  .plate-label b {
    font-family: 'Noto Serif SC Black', 'Noto Serif SC', serif; font-weight: 900;
    font-size: 38px; color: var(--ink);
  }
  .plate-label i {
    font-style: normal; font-family: 'Noto Sans SC', sans-serif;
    font-size: 20px; letter-spacing: 0.14em; color: var(--ink-3);
  }
  .vrule { position: absolute; width: 1px; background: var(--rule); }

  /* ---------- 截图标签（Codex 实录） ---------- */
  .snaplabel {
    position: absolute;
    font-family: 'Noto Sans SC', sans-serif; font-size: 21px;
    letter-spacing: 0.1em; color: var(--ink-3);
  }

  /* ---------- 页末引文与署名：钉在固定基线，绝不压进字幕带 ---------- */
  .pull {
    position: absolute; left: 72px; top: 796px; width: 960px;
    padding-top: 22px; border-top: 1px solid var(--rule);
    font-family: 'Noto Serif SC Medium', 'Noto Serif SC', serif;
    font-size: 46px; line-height: 1.48; color: var(--ink);
  }
  .handlebar {
    position: absolute; left: 72px; top: 906px; width: 560px;
    font-family: 'Noto Sans SC', sans-serif; font-size: 22px;
    letter-spacing: 0.14em; color: var(--ink-3);
  }

  /* ---------- 封面：中心安全构图 ----------
     B 站首页推荐 4:3 裁、个人空间 16:9 裁，抖音横竖各一、小红书 3:4。
     mode=wide：关键内容收中心 1440x1080；mode=v43 同构图；mode=v34：
     文字全部收进中心 810x1080，事后 PIL 居中裁出竖版。 ---------- */
  .cover-center {
    position: absolute; left: 0; right: 0; bottom: 92px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .cover-center.narrow { max-width: 810px; left: 555px; right: 555px; }
  .cover-kicker {
    font-family: 'Noto Sans SC', sans-serif; font-size: 23px;
    letter-spacing: 0.22em; color: rgba(246, 245, 237, 0.85);
  }
  .cover-title {
    margin-top: 20px;
    font-family: 'Noto Serif SC Black', 'Noto Serif SC', serif; font-weight: 900;
    font-size: 140px; line-height: 1.08; letter-spacing: -0.02em; color: #FFFFFF;
    text-shadow: 0 6px 44px rgba(0, 0, 0, 0.8), 0 2px 8px rgba(0, 0, 0, 0.9);
    white-space: pre-wrap;
  }
  .cover-center.narrow .cover-title { font-size: 84px; }
  .cover-rule { width: 190px; height: 8px; background: #AE583E; margin: 26px 0 24px; }
  .cover-hot {
    padding: 14px 26px; background: #AE583E; color: #FFF6EC;
    font-family: 'Noto Sans SC Medium', 'Noto Sans SC', sans-serif; font-size: 34px;
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.5);
}
</style>
</head>
<body>
  <div id="viewport">
    <canvas id="bed" width="1920" height="1080"></canvas>
    <div id="overlay"></div>
  </div>
  <script src="timeline.js"></script>
  <script src="director.js"></script>
</body>
</html>
